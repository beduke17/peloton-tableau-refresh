<!DOCTYPE html>
<html>
  <head>
    <title>Instructor Spotlight</title>
    <script src="tableau.extensions.1.latest.js"></script>
    <script src="main.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #content {
        width: 100%; height: 100%; position: fixed; overflow: hidden;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        box-sizing: border-box; padding: 8px; text-align: center;
      }
      .row { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 0; flex: 1; }
      .photo { max-height: 70%; max-width: 60%; height: 140px; width: 140px; border-radius: 50%; object-fit: cover; }
      .avatar {
        height: 140px; width: 140px; border-radius: 50%; background: #4e79a7; color: #fff;
        display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: bold;
      }
      .name { font-size: 18px; font-weight: bold; margin-top: 8px; }
      .count { font-size: 11px; color: #777; }
      button {
        border: 1px solid #ccc; background: #f7f7f7; border-radius: 50%; width: 32px; height: 32px;
        font-size: 16px; cursor: pointer;
      }
      button:hover { background: #e8e8e8; }
    </style>
  </head>
  <body>
    <div id="content"></div>
  </body>
</html>
